name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    # The browser download can take minutes on a cold runner.
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the API types against openapi/v1.json
        run: npm run api:check

      - name: Check the code style
        run: npm run lint

      - name: Check the types
        run: npm run type-check

      - name: Run the test suite
        run: npm run test

      - name: Build for production
        run: npm run build

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the system libraries of the browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run the browser tests
        # Journeys, axe audit (WCAG 2.2 AAA) and navigation times, against a mocked API.
        run: npm run test:e2e

      - name: Keep the screenshots and traces of the browser tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: test-results/
          retention-days: 14

      - name: Audit dependencies
        # Preserve the threshold set in JAguilar4k/ArchivumParfums-Hexagonal#335.
        run: npm audit --audit-level=critical
